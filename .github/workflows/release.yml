name: Release

# Publishes the packages to nuget.org when a GitHub release is published. It uses
# nuget.org Trusted Publishing: the job's OIDC token is exchanged for a short-lived
# API key, so no key is stored. nuget.org's trusted publishing policy names this
# file, release.yml.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Check the tag matches the version
        run: |
          VERSION=$(dotnet msbuild src/Tickwork/Tickwork.csproj -getProperty:Version)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "The release tag $GITHUB_REF_NAME does not match <Version>$VERSION</Version> in Directory.Build.props."
            exit 1
          fi

      - name: Restore
        run: dotnet restore Tickwork.slnx

      - name: Build
        run: dotnet build Tickwork.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Tickwork.slnx --configuration Release --no-build

      # net10.0 and net11.0 in every package, with its .snupkg symbol package beside it.
      - name: Pack
        run: dotnet pack Tickwork.slnx --configuration Release --no-build --output artifacts/packages

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushing a .nupkg also pushes the .snupkg next to it.
      - name: NuGet push
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
