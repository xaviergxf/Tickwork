name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      # The SDK in global.json builds both targets; the .NET 10 runtime runs the net10.0 tests.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Tickwork.slnx

      - name: Build
        run: dotnet build Tickwork.slnx --configuration Release --no-restore

      # Runs every test on net10.0 and net11.0. The Category=Database tests start
      # PostgreSQL and SQL Server through Testcontainers on the runner's Docker.
      - name: Test
        run: dotnet test Tickwork.slnx --configuration Release --no-build --logger "trx" --results-directory artifacts/test-results

      - name: Pack
        run: dotnet pack Tickwork.slnx --configuration Release --no-build --output artifacts/packages
